name: RHK Premium Permission

on:
  schedule:
    - cron: "30 15 * * *"   # 9:30 PM BD - login early, apply at 9:55 PM BD (15:55 UTC)
  workflow_dispatch:
    inputs:
      now:
        description: "Skip the wait and apply immediately (test run)"
        default: "false"
      mode:
        description: "nightly = login + apply, login = only connect one account"
        default: "nightly"
      name:
        description: "Account name (login mode)"
        default: ""

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SITE_URL: ${{ secrets.SITE_URL }}
      RUNNER_SECRET: ${{ secrets.RUNNER_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - name: Install
        run: |
          pip install -r requirements.txt
          playwright install --with-deps firefox chrome

      - name: Fetch accounts
        run: |
          curl -sf -H "x-runner-secret: $RUNNER_SECRET" \
            "$SITE_URL/.netlify/functions/export" -o accounts.json

      - name: Login in Firefox + Chrome (Gmail code / QR via the website) and build token.txt
        env:
          ONLY: ${{ github.event.inputs.mode == 'login' && github.event.inputs.name || '' }}
          # at night nobody may be there to type a code, so don't wait long and miss 9:55
          VERIFY_WAIT: ${{ github.event.inputs.mode == 'login' && '900' || '420' }}
        run: python scripts/login_tokens.py accounts.json sessions

      - name: Wait until 9:55 PM BD (15:55 UTC)
        if: github.event.inputs.mode != 'login' && github.event.inputs.now != 'true'
        run: |
          target=$(date -u -d "today 15:55:00" +%s); now=$(date -u +%s)
          [ $now -lt $target ] && sleep $((target-now)) || true

      - name: Apply (old.py - every session, 4 tokens each, output also sent to the website)
        if: github.event.inputs.mode != 'login'
        env:
          APPLY_NOW: ${{ github.event.inputs.now == 'true' && '1' || '0' }}
          # old.py stops by itself (approved / limit reached / window over 10:05 PM BD).
          # Nothing here kills it early; this only guards against a hung process.
          WINDOW_MINUTES: "5"
        run: |
          for s in sessions/*/; do
            name=$(basename "$s")
            ( cd "$s" && cp ../../old.py ../../timeshift.txt .
              for i in 1 2 3 4; do
                timeout 3000 python -u old.py $i 2>&1 | python ../../scripts/ship_logs.py "$name" $i &
              done; wait ) &
          done; wait

      - name: Clean up tokens
        if: always()
        run: rm -rf sessions accounts.json
